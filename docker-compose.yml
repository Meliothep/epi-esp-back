services:
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_container
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: user-name@domain-name.com
      PGADMIN_DEFAULT_PASSWORD: strong-password
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
        - dndiscord-network

# ========== DnDiscord ==========

  dndiscordPostgres:
    container_name: dndiscordPostgres
    image: "postgres:16"
    environment:
      POSTGRES_USER: "DnDiscord"
      POSTGRES_PASSWORD: "DnDiscordSecured"
      POSTGRES_DB: "DnDiscordDB"
      PGDATA: "/data/postgres"
    volumes:
       - local_pgdata:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - dndiscord-network
    
  dndiscordservice:
    image: dndiscordservice
    build:
      context: .
      dockerfile: Services.Dockerfile
      args:
        CONFIGURATION: Production
        SERVICE: DnDiscordAPI
        PORT: 5054
    ports:
        - 5054:5054
    environment:
        - ASPNETCORE_ENVIRONMENT=Production
    volumes:
        - ~/.vsdbg:/remote_debugger:rw
    networks:
        - dndiscord-network
        - seq-net
    depends_on:
      - dndiscordPostgres

networks:
    dndiscord-network:
      driver: bridge
    seq-net:
      external: true

volumes:
  local_pgdata:
  pgadmin-data:
  seqdata:

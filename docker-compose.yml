services:
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_container
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: user-name@domain-name.com
      PGADMIN_DEFAULT_PASSWORD: strong-password
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - dndiscord-network

  # ========== DnDiscord ==========

  dndiscordPostgres:
    container_name: dndiscordPostgres
    image: "postgres:16"
    environment:
      POSTGRES_USER: "DnDiscord"
      POSTGRES_PASSWORD: "DnDiscordSecured"
      POSTGRES_DB: "DnDiscordDB"
      POSTGRES_HOST_AUTH_METHOD: "md5"
      POSTGRES_INITDB_ARGS: "--auth=md5"
      PGDATA: "/data/postgres"
    volumes:
      - local_pgdata:/data/postgres
    ports:
      - "5433:5432"
    networks:
      - dndiscord-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U DnDiscord -d DnDiscordDB"]
      interval: 5s
      timeout: 5s
      retries: 5

  dndiscordservice:
    image: dndiscordservice
    build:
      context: .
      dockerfile: Services.Dockerfile
      args:
        CONFIGURATION: Production
        SERVICE: DnDiscordAPI
        PORT: 5054
    ports:
      - 5054:5054
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Secrets must come from .env (see .env.example). No defaults — if any of the
      # required JWT / Discord env vars are unset the container will fail to start
      # rather than silently using a committed test value.
      - Jwt__SecretKey=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - Jwt__Issuer=${JWT_ISSUER:-dndiscord-backend}
      - Jwt__Audience=${JWT_AUDIENCE:-dndiscord-frontend}
      - Jwt__ExpirationMinutes=${JWT_EXPIRATION_MINUTES:-10080}
      - Discord__ClientId=${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID is required}
      - Discord__ClientSecret=${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET is required}
      - Discord__RedirectUri=${DISCORD_REDIRECT_URI:-http://localhost:3000/auth/callback}
      - Cors__Origins__0=${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - ~/.vsdbg:/remote_debugger:rw
    networks:
      - dndiscord-network
      - seq-net
    depends_on:
      dndiscordPostgres:
        condition: service_healthy

networks:
  dndiscord-network:
    driver: bridge
  seq-net:
    external: true

volumes:
  local_pgdata:
  pgadmin-data:
  seqdata:

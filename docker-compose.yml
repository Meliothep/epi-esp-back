services:
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_container
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: user-name@domain-name.com
      PGADMIN_DEFAULT_PASSWORD: strong-password
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - dndiscord-network

  # ========== DnDiscord ==========

  dndiscordPostgres:
    container_name: dndiscordPostgres
    image: "postgres:16"
    environment:
      POSTGRES_USER: "DnDiscord"
      POSTGRES_PASSWORD: "DnDiscordSecured"
      POSTGRES_DB: "DnDiscordDB"
      POSTGRES_HOST_AUTH_METHOD: "md5"
      POSTGRES_INITDB_ARGS: "--auth=md5"
      PGDATA: "/data/postgres"
    volumes:
      - local_pgdata:/data/postgres
    ports:
      - "5433:5432"
    networks:
      - dndiscord-network

  dndiscordservice:
    image: dndiscordservice
    build:
      context: .
      dockerfile: Services.Dockerfile
      args:
        CONFIGURATION: Production
        SERVICE: DnDiscordAPI
        PORT: 5054
    ports:
      - 5054:5054
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Jwt__SecretKey=${JWT_SECRET_KEY:-c13b64cb-d917-403b-b97c-da659b7da484}
      - Jwt__Issuer=${JWT_ISSUER:-dndiscord-backend}
      - Jwt__Audience=${JWT_AUDIENCE:-dndiscord-frontend}
      - Jwt__ExpirationMinutes=${JWT_EXPIRATION_MINUTES:-10080}
      - Discord__ClientId=${DISCORD_CLIENT_ID:-DISCORD_CLIENT_ID}
      - Discord__ClientSecret=${DISCORD_CLIENT_SECRET:-DISCORD_CLIENT_SECRET}
      - Discord__RedirectUri=${DISCORD_REDIRECT_URI:-http://localhost:3000/auth/callback}
    volumes:
      - ~/.vsdbg:/remote_debugger:rw
    networks:
      - dndiscord-network
      - seq-net
    depends_on:
      - dndiscordPostgres

networks:
  dndiscord-network:
    driver: bridge
  seq-net:
    external: true

volumes:
  local_pgdata:
  pgadmin-data:
  seqdata:
